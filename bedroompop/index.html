<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedroom Pop Collection - Mirei Audio CDN</title>
    <link rel="stylesheet" href="/styles/collection.css">
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to CDN Home</a>
        
        <h1>🎵 Bedroom Pop Collection</h1>
        
        <div style="text-align:center; margin-bottom:2rem;">
            <a href="/moody/" class="back-link" style="font-size:1.1rem;">
                🎧 Browse Moody Collection →
            </a>
        </div>
        
        <div class="stats">
            <strong id="track-count">Loading tracks...</strong> • High-quality MP3 format
            <br>
            <button class="view-mode-toggle" onclick="toggleAlbumArt()">🎨 Load Album Art</button>
        </div>

        <div id="loading" class="loading">
            🎵 Loading track data...
        </div>

        <div id="error" class="error-message" style="display: none;">
            ❌ Error loading track data. Please check the console for details.
        </div>

        <div class="track-grid" id="trackGrid" style="display: none;"></div>
    </div>

    <script>
        let trackData = null;
        let albumArtLoaded = false;

        async function loadTrackData() {
            try {
                const response = await fetch('/api/bedroompop.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                
                trackData = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('track-count').textContent = 
                    `${trackData.total_tracks} tracks available`;
                
                renderTracks();
                document.getElementById('trackGrid').style.display = 'grid';
                
            } catch (error) {
                console.error('Error loading track data:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').innerHTML = 
                    `❌ Error loading track data: ${error.message}`;
            }
        }

        function formatDuration(seconds) {
            if (!seconds) return 'Unknown';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function formatBitrate(bitrate) {
            if (!bitrate) return 'Unknown';
            return `${Math.round(bitrate / 1000)}kbps`;
        }

        function renderTracks() {
            const trackGrid = document.getElementById('trackGrid');
            trackGrid.innerHTML = '';

            if (!trackData || !trackData.tracks) {
                trackGrid.innerHTML = '<div class="error-message">No tracks found</div>';
                return;
            }

            trackData.tracks.forEach((track, index) => {
                const trackItem = document.createElement('div');
                trackItem.className = 'track-item';
                trackItem.id = `track-${index}`;

                const metadata = track.metadata || {};
                const albumArt = albumArtLoaded && metadata.albumArt ? 
                    `<img src="data:${metadata.albumArt.format};base64,${metadata.albumArt.data}" 
                          alt="Album Art" class="album-art">` :
                    `<div class="album-art-placeholder">🎵</div>`;

                trackItem.innerHTML = `
                    ${albumArt}
                    <div class="track-info">
                        <div class="track-details">
                            <div class="artist">${track.artist}</div>
                            <div class="title">${track.title}</div>
                            ${metadata.album ? `<div class="album">💿 ${metadata.album}</div>` : ''}
                            <div class="meta-info">
                                ⏱️ ${formatDuration(metadata.duration)} • 
                                🎵 ${formatBitrate(metadata.bitrate)}
                                ${metadata.year ? ` • 📅 ${metadata.year}` : ''}
                            </div>
                        </div>
                        <div class="track-actions">
                            <a href="${encodeURIComponent(track.filename)}" class="download-link" download>
                                ⬇️ Download
                            </a>
                            <button class="copy-url" onclick="copyUrl('${track.filename.replace(/'/g, "\\'")}')">
                                📋 Copy URL
                            </button>
                        </div>
                    </div>
                `;

                trackGrid.appendChild(trackItem);
            });
        }

        function toggleAlbumArt() {
            const button = document.querySelector('.view-mode-toggle');
            
            if (!albumArtLoaded) {
                button.textContent = '🔄 Loading Album Art...';
                button.disabled = true;
                
                // Small delay to show loading state
                setTimeout(() => {
                    albumArtLoaded = true;
                    renderTracks();
                    button.textContent = '✅ Album Art Loaded';
                    button.className = 'view-mode-toggle loaded';
                    button.disabled = false;
                }, 500);
            }
        }

        function copyUrl(filename) {
            const baseUrl = window.location.origin;
            const fullUrl = `${baseUrl}/bedroompop/${encodeURIComponent(filename)}`;
            
            navigator.clipboard.writeText(fullUrl).then(function() {
                const button = event.target;
                const originalText = button.textContent;
                button.textContent = '✅ Copied!';
                button.style.background = '#4CAF50';
                
                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.background = '#2196F3';
                }, 2000);
            }).catch(function(err) {
                console.error('Could not copy text: ', err);
            });
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', loadTrackData);
    </script>
</body>
</html>
